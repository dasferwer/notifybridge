[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "notifybridge"
version = "0.1.0"
description = "Reliable notifications with quiet hours, digests and idempotent delivery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1", "httpx>=0.28,<1", "sqlalchemy[asyncio]>=2.0.40,<2.1", "asyncpg>=0.30,<1", "alembic>=1.16,<2", "pydantic-settings>=2.10,<3", "aio-pika>=9.5,<10", "jinja2>=3.1,<4", "prometheus-client>=0.22,<1"]
[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]
[tool.hatch.build.targets.wheel]
packages = ["src/notifybridge"]
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
